[project]
name = "scalehd"
version = "2.0.0.dev0"
description = "Huntington disease HTT CAG/CCG repeat genotyping from amplicon sequencing"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alastair Maxwell" }]
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]

[project.scripts]
scalehd = "scalehd.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
