[project]
name = "scalehd-workspace"
version = "0"
requires-python = ">=3.13"
dependencies = ["scalehd"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
scalehd = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
# Greek letters are used deliberately for model parameters.
allowed-confusables = ["γ", "β", "μ", "α"]

[tool.ruff.lint.per-file-ignores]
# BLAS thread defaults must be set before numpy is imported.
"packages/core/src/scalehd/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["packages/core/src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
addopts = "-ra"
