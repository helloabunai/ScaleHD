# docker compose up --build, then open http://localhost:8000
# Settings go in .env (copy .env.example).
services:
  scalehd:
    build: .
    image: scalehd:dev
    ports:
      # Only this machine. Drop "127.0.0.1:" to let the rest of the network in. Logins
      # then cross the network as plain HTTP, so put HTTPS in front (a reverse proxy)
      # unless the network is trusted.
      - "127.0.0.1:8000:8000"
    volumes:
      # The database.
      - scalehd-data:/data
      # Sequencing data to browse, read-only, at the same path as on the host. A
      # network share mounted under it must be mounted on the host before the
      # container starts, or add `bind: {propagation: rslave}` here.
      - type: bind
        source: ${SCALEHD_DATA_ROOT:?set SCALEHD_DATA_ROOT in .env}
        target: ${SCALEHD_DATA_ROOT}
        read_only: true
      # Results, read-write, at the same path as on the host. The folder must exist
      # and be writable by uid 1000, the container's user.
      - type: bind
        source: ${SCALEHD_WORKSPACE:?set SCALEHD_WORKSPACE in .env}
        target: ${SCALEHD_WORKSPACE}
    env_file:
      - path: .env
        required: false
    environment:
      SCALEHD_DATA_ROOT: ${SCALEHD_DATA_ROOT}
      SCALEHD_WORKSPACE: ${SCALEHD_WORKSPACE}
    restart: unless-stopped

volumes:
  scalehd-data:
