# The programs ScaleHD 1.x uses for alignment etc, at the versions its documentation lists.
name: tools
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - openjdk=8
  # FastQC java hangs without fonts
  - fontconfig
  - fonts-conda-ecosystem
  - fastqc=0.11.7
  - seqtk=1.3
  - bwa=0.7.17
  - samtools=1.9
  - freebayes=1.2.0
  - picard=2.18.23
