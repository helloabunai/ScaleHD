# Python for ScaleHD 1.x (1.1, as maintained by MVLS-RSE on github). 3.8 is the newest it runs on. It
# imports xml.etree.cElementTree, which 3.9 removed. Libraries are the newest that still
# support 3.8.
name: python
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.8.20
  - pip=24.3.1
  # pkg_resources, which ScaleHD 1.x uses, and old packages that need setuptools < 58.
  - setuptools=57.4.0
  - numpy=1.24.4
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - matplotlib-base=3.7.3
  - pandas=2.0.3
  - seaborn-base=0.13.2
  - lxml=5.3.0
  - regex=2024.7.24
  - reportlab=4.2.2
  - pysam=0.22.1
