# Python for ScaleHD 1.x (1.3.0 as per MoncktonLab on github), on the Python and libraries
# its setup.py uses.
name: python
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.8
  - pip=26.2.1
  # pkg_resources, which ScaleHD 1.x uses: setuptools 81 dropped it.
  - setuptools=80.10.2
  - numpy=2.2.1
  - scipy=1.15.1
  - scikit-learn=1.6.1
  - pysam=0.22.1
  - matplotlib-base=3.11.2
  - pandas=3.0.6
  - seaborn-base=0.13.2
  - lxml=6.1.3
  - regex=2026.9.29
  - reportlab=5.0.1
